---
title: "Concept Emergence in Language Models: Corpus Frequency, Inert Binding, and the Declarative-Evaluative Gap"
author: "Trisha Salas"
date: "July 2026"
affiliation: "Independent Researcher"
abstract: |
  Concept knowledge emerges unevenly in language models. Prior work located an emergence threshold near 2.8B parameters, a persistent gap between declarative knowledge and evaluative application, and a deep-layer attention-binding signal that tracks emergence — using web accessibility as the test domain: a specialized, low-frequency vocabulary with unambiguous answers and practical stakes, concrete enough to evaluate and rare enough to show scale sensitivity. Here we ask what the binding signal is made of, and what actually predicts the failures. Using the Pythia suite (160M–12B) and GPT-2 (small–XL), a head-level audit shows binding is a correlate, not a mechanism: the late-layer binding heads are attention sinks and positional heads, the signal is not concept-specific, and pre-registered joint ablation of the entire deep selective population — two heads, for the strongest-binding compound — shifts the output distribution by a KL divergence of 2×10⁻⁵ — indistinguishable from leaving the heads untouched. What does predict production failure is corpus frequency: bigram counts correlate with behavioral trajectory across 49 compounds (ρ ≈ 0.57) — and this frequency preference has a precise physical home. A fixed per-token offset that the model adds to every prediction at its output layer is itself ordered by training-data frequency (ρ up to 0.78 against Pile token counts): a built-in head start for common words, applied before context has any say. The logit lens, a standard interpretability shortcut, reads the model's internal state before that offset is applied — so the most common way of looking inside these models is blind to the very preference that drives the behavior. Our instrumentation demonstrated the cost directly: we retracted one of our own results after finding that text generated through the logit-lens shortcut diverges from the model's true output within seven tokens at every scale tested — a measurement-artifact class we characterize systematically. The behavioral results of prior work replicate throughout: the declarative-evaluative gap persists to maximum scale, ARIA exhibits fluent wrongness at every scale tested, and the main findings were independently recovered under a pre-registered blind validation protocol. Attention binding marks emergence; corpus statistics drive it; and what your instruments compute determines what your mechanisms appear to be.
