# ============================================================
# Consolidated Prompt File — Paper 1 TMLR Submission
# ============================================================
# All prompts for Experiment 1 (Declarative & Evaluative Elicitation)
# Organized by prompt_type for readability.
#
# Schema:
#   prompt_id      — unique identifier
#   concept        — accessibility concept or control
#   prompt_type    — declarative | evaluative | completion | hypothesis | validation | control
#   template_type  — cloze | code_review | few_shot | bare | direct_question | error_correction | socratic | instruction | scenario | evaluative
#   prompt         — the actual prompt text
#   max_tokens     — generation limit
#
# Notes:
#   - Original Paper 1 used max_new_tokens=10 (declarative) and 20 (evaluative).
#     Standardized to 100 here to capture full confabulation patterns.
#     Models that know the answer stop early; extra room doesn't change results.
#   - Bicycle prompts serve as non-accessibility control (domain the model definitely knows).
#   - HTML/ARIA confabulation controls test confident wrongness.
# ============================================================

