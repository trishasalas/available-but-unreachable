experiment: elicitation_robustness_test
model_target: Pythia-2.8B

completion_tasks:
  description: "HTML completion prompts testing token-level knowledge. No predicted failure - observing model behavior."
  test_cases:
  - type: "Alt Text - Few Shot"
    description: "Few-shot HTML completion with alt text pattern established."
    prompt: '<img src="icons/home.png" alt="Home"><img src="icons/mail.png" alt="Inbox"><img src="photo.jpg"'

  - type: "Alt Text - Bare"
    description: "Bare HTML completion with no prior alt text pattern."
    prompt: '<img src="photo.jpg"'

  - type: "Closed Captions - Few Shot"
    description: "Few-shot HTML completion with caption track pattern established."
    prompt: '<video src="intro.mp4"><track kind="captions" src="intro.vtt"></video><video src="demo.mp4"><track kind="captions" src="demo.vtt"></video><video src="lecture.mp4">'

  - type: "Closed Captions - Bare"
    description: "Bare HTML completion with no prior caption pattern."
    prompt: '<video src="lecture.mp4">'

  - type: "Page Title - Few Shot"
    description: "Few-shot HTML completion with title pattern established."
    prompt: '<html><head><title>About Us</title></head><html><head><title>Contact</title></head><html><head>'

  - type: "Page Title - Bare"
    description: "Bare HTML completion with meta charset instead of title pattern."
    prompt: '<html><head><meta charset="utf-8">'

  - type: Script Source - Bare (Control)
    description: Bare non-accessibility control.
    prompt: <script

  - type: Script Source - Few Shot (Control)
    description: Few-shot non-accessibility control. Tests general HTML completion ability.
    prompt: |-
      <script src="utils.js"></script><script src="main.js"></script><script src="
